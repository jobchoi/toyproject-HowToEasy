# Canonical service definition; use the generated project-root compose.yaml entrypoint.
services:
  web:
    build:
      context: ${POSTING_CODE_DIR:?prepare-posting must set POSTING_CODE_DIR}
      dockerfile: Dockerfile
    image: posting-automation-web:local
    user: "${POSTING_UID:?}:${POSTING_GID:?}"
    # Linux host networking keeps Tailscale's loopback proxy source intact.
    # Uvicorn binds only 127.0.0.1:8010; there is deliberately no ports mapping.
    network_mode: host
    environment:
      POSTING_ALLOWED_HOSTS: ${POSTING_ALLOWED_HOSTS:?}
    volumes:
      - type: bind
        source: ${POSTING_DATA_DIR:?}
        target: /app/.local/ui
        bind:
          create_host_path: false
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8010/api/config', timeout=3).status == 200"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
